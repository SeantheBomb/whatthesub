name: Seed Daily Puzzles

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC — just after midnight
  workflow_dispatch:        # also triggerable manually from the Actions tab
    inputs:
      date:
        description: 'Date to generate (YYYY-MM-DD, defaults to today UTC)'
        required: false

jobs:
  seed:
    name: Generate today's puzzles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate WhatTheSub puzzle
        run: node scripts/generate-puzzle.mjs ${{ github.event.inputs.date }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:      ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:      ${{ secrets.REDDIT_PASSWORD }}

      - name: Generate Find the Thread puzzle
        run: node scripts/generate-thread.mjs ${{ github.event.inputs.date }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:      ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:      ${{ secrets.REDDIT_PASSWORD }}
