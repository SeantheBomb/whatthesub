name: Seed Daily Puzzle

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC — just after midnight
  workflow_dispatch:        # also triggerable manually from the Actions tab

jobs:
  seed:
    name: Generate today's puzzle
    runs-on: ubuntu-latest
    steps:
      - name: POST /generate to daily worker
        run: |
          curl -X POST "https://whatthesub-daily.sean-feeser.workers.dev/generate" \
            --fail --silent --show-error --max-time 30
