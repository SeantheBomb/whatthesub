<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Thread — Daily Reddit Puzzle</title>
  <meta name="description" content="Group 16 Reddit comments by their original post. One new puzzle every day.">
  <meta property="og:title" content="Find the Thread">
  <meta property="og:description" content="Can you group these Reddit comments by their source post?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="masthead">
    <div class="masthead-top">
      <div>
        <h1 class="masthead-title">Find the Thread</h1>
        <p class="masthead-tagline">A daily Reddit puzzle</p>
      </div>
      <div>
        <p class="masthead-date" id="today-date"></p>
        <div class="strike-counter">
          <span class="strike-dot" id="strike-0" title="Strike 1"></span>
          <span class="strike-dot" id="strike-1" title="Strike 2"></span>
          <span class="strike-dot" id="strike-2" title="Strike 3"></span>
        </div>
      </div>
    </div>
    <nav class="masthead-nav">
      <a href="/home.html">Home</a>
      <a href="/thread.html" class="active">Today</a>
      <a href="/index.html">WhatTheSub</a>
      <button class="nav-auth-btn" id="auth-nav-btn" onclick="openAuthModal()">Sign In</button>
    </nav>
  </header>

  <main>
    <div id="game-container">
      <p class="loading">Loading today's puzzle…</p>
    </div>
  </main>

  <!-- Auth modal -->
  <div class="modal-overlay" id="auth-modal" role="dialog" aria-modal="true">
    <div class="modal" style="position:relative;">
      <div id="auth-tabs" style="display:flex;gap:1rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:0.75rem;">
        <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Create Account</button>
      </div>

      <form id="login-form">
        <label class="auth-label">Username</label>
        <input class="auth-input" type="text" id="login-username" autocomplete="username" placeholder="your_username">
        <label class="auth-label" style="margin-top:0.75rem;">Password</label>
        <input class="auth-input" type="password" id="login-password" autocomplete="current-password" placeholder="••••••••">
        <p class="auth-error" id="login-error"></p>
        <button class="auth-submit" type="submit">Sign In</button>
      </form>

      <form id="register-form" style="display:none">
        <label class="auth-label">Username</label>
        <input class="auth-input" type="text" id="reg-username" autocomplete="username" placeholder="3–20 chars, letters/numbers/_">
        <label class="auth-label" style="margin-top:0.75rem;">Email</label>
        <input class="auth-input" type="email" id="reg-email" autocomplete="email" placeholder="you@example.com">
        <label class="auth-label" style="margin-top:0.75rem;">Password</label>
        <input class="auth-input" type="password" id="reg-password" autocomplete="new-password" placeholder="8+ characters">
        <p class="auth-error" id="register-error"></p>
        <button class="auth-submit" type="submit">Create Account</button>
      </form>

      <button class="auth-close" onclick="closeAuthModal()">&#x2715;</button>
    </div>
  </div>

  <!-- End-game modal -->
  <div class="modal-overlay" id="end-modal" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 class="modal-title" id="end-title"></h2>
      <p class="modal-subtitle" id="end-message"></p>

      <div class="share-box" id="share-card" aria-label="Shareable result"></div>
      <button class="copy-btn" id="copy-btn">Copy to Clipboard</button>

      <div class="answers-reveal">
        <h3>Today's Answers</h3>
        <div id="answers-reveal"></div>
      </div>

      <button class="play-again-btn" id="play-again-btn">↺ Play Again (Admin)</button>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/thread-storage.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/thread-game.js"></script>
</body>
</html>
